modules:
- module: 1. 技能面板
  shared_preconditions:
  - 面板已打开，停在技能视图；本机已安装中文技能包。
- module: 2. 任务板
  shared_preconditions:
  - 面板已打开；`gh` CLI 已登录；工作目录为有 origin remote 的 git 仓库。
- module: 3. 票详情与动作
  shared_preconditions:
  - 任务板已加载；所选票带 wayfinder 类型标签。
- module: 4. 注入链路
  shared_preconditions:
  - 面板已打开；技能或票已选中。
- module: 5. 键盘与鼠标并行
  shared_preconditions:
  - 面板已打开。
- module: 6. 数据一致性
  shared_preconditions:
  - 面板已打开；本仓库 issue 集合固定。
- module: 7. 回写契约
  shared_preconditions:
  - 面板已打开。
- module: 8. 状态栏与命令
  shared_preconditions: []
